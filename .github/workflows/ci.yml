name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Next.js App (Node 20)
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-jwt-secret-key-minimum-32-chars!!
      NEXT_PUBLIC_APP_URL: http://localhost:3050
      PROMO_CODES: WELCOME7:7,TRIAL3:3
      DATABASE_PATH: ./ci_test.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate DB (v3)
        run: node prisma/migrate-v3.js
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3
